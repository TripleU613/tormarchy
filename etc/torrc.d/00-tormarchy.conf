# Managed by tormarchy. Edits here are overwritten by setup.
#
# Ports the transparent-proxy ruleset redirects into. Changing them means
# changing lib/common.sh to match.

SocksPort 9050

# IsolateClientProtocol keeps unrelated protocols off the same circuit, which
# matters more here than usual: with everything on the box funnelled through
# one TransPort, without it a torrent client and a browser could share a path.
TransPort 9040 IsolateClientAddr IsolateClientProtocol

DNSPort 9053

# Control port, cookie-authenticated. Group-readable so a user in the 'tor'
# group can request a new circuit without a password prompt.
#
# No CookieAuthFile override: the cookie stays at tor's default location inside
# DataDirectory (/var/lib/tor). That is deliberate. Arch's tor.service runs with
# ReadOnlyDirectories=/ and declares only /var/lib/tor and /var/log/tor
# writable, so any other path -- /run/tor included -- cannot be written from
# inside the service's namespace whatever its ownership. Putting the cookie
# anywhere else means fighting the sandbox; putting it here means the sandbox
# already agrees. setup relaxes /var/lib/tor from 0700 to 0750 so the tor group
# can traverse in and read it.
ControlPort 9051
CookieAuthentication 1
CookieAuthFileGroupReadable 1

# Without this, tor clamps DataDirectory back to 0700 every time it starts,
# whatever the tmpfiles rule says -- it enforces its own idea of safe
# permissions on its state directory. That silently undoes the group access the
# cookie needs, so the control port stops answering and "New circuit", the
# bootstrap percentage, the circuit path and the traffic counters all go quiet
# with nothing logged to explain it.
DataDirectoryGroupReadable 1

# Onion names get a virtual address that the ruleset sends to TransPort. The
# nat chain matches this range before the LAN exemption, since 10.192.0.0/10
# sits inside 10.0.0.0/8.
VirtualAddrNetworkIPv4 10.192.0.0/10
AutomapHostsOnResolve 1
AutomapHostsSuffixes .onion,.exit

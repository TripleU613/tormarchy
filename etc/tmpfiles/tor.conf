# Managed by tormarchy.
#
# Overrides /usr/lib/tmpfiles.d/tor.conf, which the tor package ships as:
#
#   d /var/lib/tor 0700 tor tor - -
#
# A file of the same name under /etc/tmpfiles.d takes precedence, which is the
# supported way to change this. Doing it with chmod instead does not last: the
# packaged rule is reapplied at boot and on any systemd-tmpfiles run, silently
# putting 0700 back and breaking control-port access again days later.
#
# 0750 rather than 0700 lets the tor group traverse in to read the
# group-readable control cookie, which is what makes "New circuit" work without
# a password. Everyone outside the group is still shut out.
d /var/lib/tor 0750 tor tor - -

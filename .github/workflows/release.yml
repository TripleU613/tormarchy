name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck libxml2-utils nftables

      # A tag is what the plugin marketplace and anyone's `omarchy plugin
      # update` will pull, so it has to pass everything before it becomes a
      # release rather than after.
      - name: Run checks
        run: sudo -E .github/scripts/check.sh

      # The marketplace reads the version out of manifest.json, not the tag. If
      # the two disagree, a listing claims one version while the code says
      # another and nobody can tell which they have installed.
      - name: Check the tag matches manifest.json
        run: |
          tag="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          tag_version="${tag#v}"
          manifest_version=$(python3 -c 'import json;print(json.load(open("manifest.json"))["version"])')
          echo "tag:      $tag_version"
          echo "manifest: $manifest_version"
          if [[ $tag_version != "$manifest_version" ]]; then
            echo "::error::Tag $tag does not match manifest.json version $manifest_version. Bump one of them."
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          # --generate-notes builds the changelog from merged pull requests, so
          # contributors show up without anyone maintaining a CHANGELOG by hand.
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            --verify-tag

name: CI

on:
  pull_request:
  push:
    branches: [master, main]
  # So a contributor can re-run a check after an unrelated fix, without having
  # to push an empty commit.
  workflow_dispatch:
  # Weekly, against whatever Omarchy and Qt are current. The widget once broke
  # with no change on this side at all -- a Qt release changed how a bare name
  # resolved -- and nothing ran to notice until a user did.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    name: Checks
    runs-on: ${{ !contains(fromJSON('["pull_request","pull_request_review","pull_request_target","issue_comment","workflow_run"]'), github.event_name) && 'debiantripleu-ci' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          # shellcheck lints the bootstrap, libxml2-utils provides xmllint for
          # the polkit policy and the logo, nftables validates the real ruleset,
          # and tor is what the daemon scenarios find on PATH as "installed".
          sudo apt-get install -y -qq shellcheck libxml2-utils nftables iproute2 python3 tor

          # The ruleset exempts tor's own traffic with `meta skuid "tor"`, and
          # nft resolves usernames when it parses the file rather than when it
          # runs. The tor package makes the account; this covers a runner whose
          # package names it differently.
          getent passwd tor >/dev/null || sudo useradd --system --no-create-home --shell /usr/sbin/nologin tor
          id tor

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      # Run as root so the nftables check actually happens. It is the only part
      # of the suite needing the kernel, and the part most worth running: the
      # ruleset is what can take someone's network down.
      - name: Run checks
        run: sudo -E env "PATH=$PATH" .github/scripts/check.sh

  shell:
    name: Loads in the shell
    runs-on: ${{ !contains(fromJSON('["pull_request","pull_request_review","pull_request_target","issue_comment","workflow_run"]'), github.event_name) && 'debiantripleu-ci' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PySide6's wheels bring Qt itself, but not the system GL, keyboard and
      # font libraries it links against. Not pinned below the current release:
      # Arch ships each Qt release within days, and that is what the widget
      # meets on a real machine.
      - name: Install Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-venv libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          # Node runs the menu check: Omarchy's own MenuModel.js parsing the
          # rows the helper's `menu add` writes.
          command -v node >/dev/null || sudo apt-get install -y -qq nodejs
          node --version
          python3 -m venv "$RUNNER_TEMP/qt"
          "$RUNNER_TEMP/qt/bin/pip" install -q "PySide6>=6.12"

      # The shell the widget is loaded into: Omarchy's own qs.Commons and qs.Ui,
      # at their current state rather than a copy that would go stale here.
      # Both the latest release, which is what most machines run, and the
      # development branch, which is what they run next: a widget written
      # against one alone has failed to load on the other.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # The menu check drives the real helper through Omarchy's own parser.
      - name: Build the helper
        run: cargo build --locked

      - name: Fetch Omarchy, released and in development
        run: |
          repo=https://github.com/basecamp/omarchy.git
          # Final releases only. Version sort ranks v4.5.0-rc3 above v4.5.0, so
          # without the filter "the latest release" was a release candidate.
          release=$(git ls-remote --tags --refs --sort=-v:refname "$repo" 'v*' | sed 's|.*refs/tags/||' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          echo "latest release: $release"
          git clone -q --depth 1 --branch "$release" "$repo" "$RUNNER_TEMP/omarchy-release"
          git clone -q --depth 1 "$repo" "$RUNNER_TEMP/omarchy-dev"

      - name: Load the widget in every state
        env:
          OMARCHY_PATH: ${{ runner.temp }}/omarchy-release ${{ runner.temp }}/omarchy-dev
          PYTHON: ${{ runner.temp }}/qt/bin/python
          QT_QPA_PLATFORM: offscreen
        run: .github/scripts/shell.sh
